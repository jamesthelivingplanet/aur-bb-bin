name: Publish AUR package

on:
  push:
    branches:
      - master
    paths:
      - PKGBUILD
      - .SRCINFO
      - LICENSE
      - bb-launcher.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-aur-package
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 30

    steps:
      - name: Checkout package repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install packaging tools
        run: pacman -Syu --noconfirm git openssh pacman-contrib

      - name: Restore Git metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ -d .git ]; then
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          else
            git init
            git clean -fdx
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi
          git fetch --prune origin "+refs/heads/*:refs/remotes/origin/*"
          git switch --force-create master origin/master

      - name: Build package
        run: |
          set -euo pipefail
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- env HOME=/home/builder \
            bash -lc "cd '$GITHUB_WORKSPACE' && makepkg --cleanbuild --force"
          chown -R root:root "$GITHUB_WORKSPACE"

      - name: Push package recipe to AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$AUR_SSH_PRIVATE_KEY"

          key_file="$(mktemp)"
          known_hosts_file="$(mktemp)"
          trap 'rm -f "$key_file" "$known_hosts_file"' EXIT
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          ssh-keyscan -t ed25519 aur.archlinux.org > "$known_hosts_file"

          aur_checkout="$(mktemp -d)"
          trap 'rm -f "$key_file" "$known_hosts_file"; rm -rf "$aur_checkout"' EXIT
          export GIT_SSH_COMMAND="ssh -i $key_file -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known_hosts_file"

          # The AUR accepts only package files at the repository root. Keep the
          # GitHub-only workflow files out of the AUR checkout.
          git clone ssh://aur@aur.archlinux.org/bb-bin.git "$aur_checkout"
          cp "$GITHUB_WORKSPACE/PKGBUILD" "$aur_checkout/PKGBUILD"
          cp "$GITHUB_WORKSPACE/.SRCINFO" "$aur_checkout/.SRCINFO"
          cp "$GITHUB_WORKSPACE/LICENSE" "$aur_checkout/LICENSE"
          cp "$GITHUB_WORKSPACE/bb-launcher.sh" "$aur_checkout/bb-launcher.sh"

          cd "$aur_checkout"
          if git diff --quiet -- PKGBUILD .SRCINFO LICENSE bb-launcher.sh; then
            echo "AUR package recipe is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- PKGBUILD .SRCINFO LICENSE bb-launcher.sh
          git commit -m "Update bb-bin package"
          git push origin HEAD:master
